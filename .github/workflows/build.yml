# push するたびに jar をビルドする。tag (v0.3.0 など) を push すると Releases に jar を添付する。
# build_mod.bat と同じ手順: Forge MDK をダウンロードして、このリポジトリのソースを入れてビルドする。
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  MC_VERSION: "1.20.1"
  FORGE_VERSION: "47.4.10"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download Forge MDK
        run: |
          curl -fsSL -o mdk.zip "https://maven.minecraftforge.net/net/minecraftforge/forge/${MC_VERSION}-${FORGE_VERSION}/forge-${MC_VERSION}-${FORGE_VERSION}-mdk.zip"
          mkdir work
          unzip -q mdk.zip -d work

      - name: Install sources
        run: |
          cp build.gradle gradle.properties settings.gradle work/
          rm -rf work/src
          cp -r src work/src
          chmod +x work/gradlew

      - name: Build
        working-directory: work
        run: ./gradlew --no-daemon build

      - uses: actions/upload-artifact@v4
        with:
          name: worldprestige
          path: work/build/libs/*.jar

      - name: Attach jar to the release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: work/build/libs/*.jar
